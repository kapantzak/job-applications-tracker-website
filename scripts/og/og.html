<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Manrope';
    font-weight: 200 800;
    src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2');
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background-color: oklch(0.985 0.006 293); color: oklch(0.17 0.02 293);
    font-family: 'Manrope', sans-serif;
    padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between;
    border-top: 10px solid #7c3aed;
    /* The site hero's band and grid (src/components/Hero.astro, light theme), full-bleed. */
    background-image:
      linear-gradient(to right, oklch(0.541 0.281 293 / 0.1) 1px, transparent 1px),
      linear-gradient(to bottom, oklch(0.541 0.281 293 / 0.1) 1px, transparent 1px),
      linear-gradient(160deg, oklch(0.94 0.05 270), oklch(0.89 0.09 293) 35%, oklch(0.9 0.08 315) 65%, oklch(0.94 0.05 335));
    background-size: 48px 48px, 48px 48px, 100% 100%;
  }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .brand svg { width: 56px; height: 56px; }
  h1 { font-size: 66px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; max-width: 980px; }
  .cmd {
    align-self: flex-start; display: flex; gap: 16px; align-items: center;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 34px;
    background: oklch(0.955 0.015 293); border: 2px solid oklch(0.91 0.02 293);
    border-radius: 16px; padding: 20px 32px;
  }
  .cmd span { color: oklch(0.52 0.03 293); }
</style>
</head>
<body>
  <div class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="7" fill="#7c3aed"/>
      <g transform="translate(5.12 5.12) scale(0.68)" fill="none" stroke="#fafafa" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="14" cy="14" r="8.6" stroke-width="2.6"/>
        <path d="M20.6 20.6 26.6 26.6" stroke-width="3.2"/>
        <path d="M10.2 14.3 13 17.1 18.1 11.6" stroke-width="2.7"/>
      </g>
    </svg>
    Job Applications Tracker
  </div>
  <h1>Find jobs and track your applications with the AI&nbsp;agent you already&nbsp;use</h1>
  <div class="cmd"><span>$</span> npx job-applications-tracker</div>
</body>
</html>
